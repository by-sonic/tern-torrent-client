name: Bug report
description: Something in Tern does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tern version
      description: Settings → Updates shows it.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please use an open, legal torrent such as a Linux ISO, and do not paste links to copyrighted content.
    validations:
      required: true
