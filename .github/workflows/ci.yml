name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Lifecycle scripts stay off for everything except the one package that needs them:
      # WebTorrent imports node-datachannel, which fetches its prebuilt native binary in an install script.
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-datachannel
      - name: Native module is present
        run: node -e "import('node-datachannel').then(() => console.log('node-datachannel OK'))"
      - run: npm test
